[markup.goldmark]
  defaultMarkdownHandler = []
  [markup.goldmark.extensions]
    table = true
    tableAlign = ['left', 'center', 'right']
    link = true
    linkTitle = true
    strikethrough = true
    tagfilter = true
    typographer = true
    lint = true
  [markup.goldmark.parser]
    anchorize = true
  [markup.goldmark.renderer]
    hardWraps = false
    infoStyle = 'code'
    highlightCode = true
    unsafe = true

[markup.highlight]
  style = 'github-dark-default'
  noHighlight = ['bash', 'shell', 'makefile', 'toml']

[markup.tableOfContents]
  startLevel = 2
  endLevel = 4

# [module]
#   [[module.imports]]
#     path = 'vendor'

[blackfriday]
  plainlinks = true
  renderedPI = true
  anchors = true
  hrefTargetBlank = true
  sections = true
  fragPrefix = 'id_'

# Taxonomies
[taxonomies]
  tag = 'tags'
  category = 'categories'
  series = 'series'
  author = 'authors'

# Menu configuration - matches live site structure
[menu]
  [[menu.main]]
    identifier = 'home'
    name = 'Home'
    pageRef = '/'
    weight = 10

  [[menu.main]]
