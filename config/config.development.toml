baseURL = 'https://reviews.ultramarine963.com/'
title = 'Venus Reviews'

# Theme configuration
[params]
  author = 'Venus Reviews Team'
  description = 'Independent, discreet, and transparent reviews of premium pleasure products from US-based experts'
  keywords = ['reviews', 'premium', 'products', 'expert', 'discreet']
  license = 'none'
  canonical = false

  # Design settings
  mainFont = 'Inter'
  fontDisplay = ['Inter', 'Merriweather', 'Georgia']
  accentColor = '#6366f1'
  bgColor = '#ffffff'
  altBgColor = '#f8fafc'

  # Hero settings
  hero = true
  heroBg = 'gradient-to-br from-indigo-50 via-purple-50 to-pink-50'
  heroImage = 'images/hero-placeholder.png'

  # Navigation - matches live site structure
  navItems = ['Home', 'Reviews', 'Guides', 'Best For', 'About']

  # Meta
  favicon = 'images/favicon.ico'
  rss = false
  rssLimit = 10

