{{ define "title" }}{{ .Title }} — {{ .Site.Title }}{{ end }}
{{ define "main" }}
<section class="page-header">
  <div class="container">
    <h1>{{ .Title }}</h1>
    {{ with .Description }}<p>{{ . }}</p>{{ end }}
  </div>
</section>
<section class="content-body">
  <div class="container">
    <div class="legal-content">
      {{ .Content }}
    </div>
  </div>
</section>
{{ end }}
