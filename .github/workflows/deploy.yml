name: Deploy Venus to Hostinger

on:
  push:
    branches:
      - dev
      - staging
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: 'latest'
          extended: true

      - name: Build Hugo Site
        run: |
          if [ "${{ github.ref }}" = "refs/heads/dev" ]; then
            hugo --config config.development.toml --destination public-dev
          elif [ "${{ github.ref }}" = "refs/heads/staging" ]; then
            hugo --config config.staging.toml --destination public-staging
          elif [ "${{ github.ref }}" = "refs/heads/master" ]; then
            hugo --config config.production.toml --destination public
          fi

      - name: Deploy to Hostinger
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USERNAME }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          source: |
            ${{ github.ref == 'refs/heads/dev' && 'public-dev/*' || '' }}
            ${{ github.ref == 'refs/heads/staging' && 'public-staging/*' || '' }}
            ${{ github.ref == 'refs/heads/master' && 'public/*' || '' }}
          target: |
            ${{ github.ref == 'refs/heads/dev' && secrets.HOSTINGER_DEV_PATH || '' }}
            ${{ github.ref == 'refs/heads/staging' && secrets.HOSTINGER_STAGING_PATH || '' }}
            ${{ github.ref == 'refs/heads/master' && secrets.HOSTINGER_PROD_PATH || '' }}
          strip_components: 1
          rm: true

      - name: Deployment Notification
        run: |
          echo "✅ Deployed ${{ github.ref }} to Hostinger"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
